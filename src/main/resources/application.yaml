spring:
  application:
    name: DigitalLibrary

  datasource:
    url: jdbc:mysql://localhost:3306/digital_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: M@n@&123
    driver-class-name: com.mysql.cj.jdbc.Driver   # optional but added for clarity

    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      pool-name: HikariPool-1
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Custom properties (your own config)
application:
  baseUrls: http://localhost:8080
  assetPaths: /var/www/html/digital_library

server:
  port: 8080